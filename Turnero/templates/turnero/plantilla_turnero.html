{% load static %}

<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Pantalla de Turnos{% endblock title %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bloque de estilos -->
    {% block estilo %}
    <link rel="stylesheet" href="{% static 'css/turnero.css' %}">
    {% endblock estilo %}
</head>

<body style="background:#f1f5f9;">

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container py-4">
        {% block content %}
        {% endblock content %}
    </main>

    <!-- Bloque de Scripts -->
    {% block script %}
    {% endblock script %}

</body>
</html>
